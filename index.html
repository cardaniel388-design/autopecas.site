<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Autopeças é para você</title>
<style>
:root{--red:#e10600;--bg:#000;--card:#151515;--muted:#b3b3b3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:17px/1.5 Arial,sans-serif}main{max-width:520px;margin:auto;padding:28px 20px 44px;text-align:center}.logo{border-bottom:3px solid var(--red);padding-bottom:14px;margin-bottom:28px;font-weight:900;text-transform:uppercase}.eyebrow{color:#ff3b30;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.08em}h1,h2{line-height:1.05;text-transform:uppercase;font-weight:900}h1{font-size:clamp(38px,11vw,54px)}h2{font-size:32px}p{color:var(--muted)}button,a{font:800 20px Arial}.btn{display:block;width:100%;padding:17px;background:var(--red);color:#fff;border:0;border-radius:10px;text-decoration:none;cursor:pointer}.options{display:grid;gap:12px;margin-top:28px}.option{padding:18px;background:var(--card);border:2px solid #333;border-radius:12px;color:#fff;text-align:left;cursor:pointer}.option:hover{border-color:var(--red)}.bar{height:9px;background:#222;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:.3s}.plan{background:var(--card);border:2px solid #333;border-radius:16px;padding:22px;text-align:left;margin-top:20px}.plan.hl{border-color:var(--red)}.price{color:#ff3b30;font-size:48px;font-weight:900}.plan li{margin:10px 0}.faq{text-align:left;margin-top:30px}.faq details{background:var(--card);border:1px solid #333;border-radius:10px;padding:14px;margin:9px 0}.faq summary{font-weight:700;cursor:pointer}.small{font-size:14px}
</style>
</head>
<body><main id="app"></main><script>
const qs=[['O que mais te descreve hoje?',['Quero meu primeiro emprego','Quero mudar de área e entrar em autopeças','Já trabalho em loja, mas quero crescer','Quero ajudar no negócio da família']],['Quanto você entende de carros hoje?',['Quase nada','O básico','Conheço bem alguns sistemas']],['Quanto tempo por dia você teria para estudar?',['Menos de 1 hora','1 a 2 horas','Mais de 2 horas']],['O que mais te preocupa no balcão?',['Não saber o nome e a função das peças','Medo de vender a peça errada','Não saber lidar com o cliente','Tudo isso junto']],['Onde você quer trabalhar?',['Em loja de autopeças','Em oficina ou concessionária','Vendendo por WhatsApp e online']]];let n=0,ans=[];const app=document.querySelector('#app');function head(){return'<div class="logo">Autopeças é para você</div>'}function home(){app.innerHTML=head()+'<div class="eyebrow">Para quem quer trabalhar em autopeças</div><h1>Descubra seu caminho como atendente</h1><p>Responda 5 perguntas rápidas e descubra por onde começar para trabalhar como atendente, mesmo sem experiência.</p><button class="btn" onclick="start()">Quero meu plano →</button><p class="small">Leva menos de 1 minuto. Sem cadastro.</p>'}function start(){n=0;ans=[];ask()}function ask(){let q=qs[n];app.innerHTML=head()+'<div class="bar"><i style="width:'+((n+1)*20)+'%"></i></div><p>Pergunta '+(n+1)+' de 5</p><h2>'+q[0]+'</h2><div class="options">'+q[1].map((x,i)=>'<button class="option" onclick="pick('+i+')">'+x+' →</button>').join('')+'</div>'}function pick(i){ans.push(i);if(++n<qs.length)ask();else result()}function result(){app.innerHTML=head()+'<div class="eyebrow">Seu resultado</div><h1>Seu plano está pronto</h1><p>Aprenda a identificar peças, confirmar a compatibilidade do veículo e atender com segurança no balcão e no WhatsApp.</p><div class="plan"><h2>Guia Essencial</h2><div class="price">R$ 19,90</div><p>Pagamento único · acesso imediato</p><ul><li>Guia completo do zero ao atendimento</li><li>Sistemas do carro e peças</li><li>Compatibilidade e atendimento</li></ul><a class="btn" href="https://pay.kiwify.com.br/lpcdSxV">Quero o Essencial →</a></div><div class="plan hl"><h2>Guia Completo + Bônus</h2><div class="price">R$ 37,90</div><p>Pagamento único · acesso imediato</p><ul><li>Tudo do Guia Essencial</li><li>Roteiros de atendimento</li><li>Checklist, dicionário e kit de currículo</li></ul><a class="btn" href="https://pay.kiwify.com.br/Xke3AYj">Quero o Completo →</a></div><div class="faq"><h2>FAQ</h2><details><summary>Preciso ter experiência?</summary><p>Não. O guia parte do zero.</p></details><details><summary>Posso estudar pelo celular?</summary><p>Sim, o conteúdo é digital.</p></details><details><summary>Tem garantia?</summary><p>Sim, 7 dias.</p></details></div><p class="small">Conteúdo educativo. Não garante emprego ou remuneração.</p>}home();
</script></body></html>
